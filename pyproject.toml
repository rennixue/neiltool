[project]
name = "neiltool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asyncmy>=0.2.11",
  "dotenv>=0.9.9",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "llama-cloud>=2.13.0",
  "openai>=2.50.0",
  "pathvalidate>=3.3.1",
  "pillow>=12.3.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pymupdf>=1.28.0",
  "python-pptx>=1.0.2",
  "sqlalchemy>=2.0.51",
  "starlette>=1.3.1",
  "tenacity>=9.1.4",
  "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["F405"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest]
minversion = "9.0"
addopts = [
  "--capture=no",
  "--import-mode=importlib",
]
log_cli = true
log_cli_level="INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_cli_date_format = "%H:%M:%S"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope="function"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
